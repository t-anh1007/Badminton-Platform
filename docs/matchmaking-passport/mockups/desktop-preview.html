letter-spacing:.08em;font-weight:800}.nav-links .current{color:var(--yellow)}.nav-right{display:flex;align-items:center;gap:14px}.nav-avatar{height:36px;width:36px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--navy);font-size:13px;font-weight:900}.app-content{max-width:1320px;margin:auto;padding:35px 54px 100px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin-bottom:10px}.h1{font-size:38px;color:var(--navy);margin:0 0 10px}.h2{font-size:22px;color:var(--navy);margin:0 0 16px}.h3{font-size:17px;color:var(--navy);margin:0 0 10px;font-weight:800}.sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}.grid{display:grid;gap:20px}.two{grid-template-columns:minmax(0,1.65fr) minmax(310px,1fr)}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 1px 4px rgba(21,68,108,.04)}.card.tight{padding:18px}.soft{background:#f2f5f6;border:1px solid #dbe4e9;border-radius:12px;padding:16px}.navy-card{background:var(--navy);border-color:var(--navy);color:#fff}.navy-card .h2,.navy-card .h3,.navy-card .sub{color:#fff}.yellow-card{background:#fff9d8;border-color:#f0e79e}.warning-card{background:var(--amberbg);border:1px solid #f2d987;border-radius:12px;padding:16px;color:#60430b}.danger-card{background:var(--redbg);border:1px solid #f4c6cc;border-radius:12px;padding:16px;color:#6d1a24}.success-card{background:var(--greenbg);border:1px solid #bfdccd;border-radius:12px;padding:16px;color:#1d5945}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.stack{display:grid;gap:16px}.smallgap{gap:10px}.gap8{gap:8px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.strong{font-weight:800}.divider{height:1px;background:var(--line);margin:18px 0}.btn{border:0;border-radius:100px;background:var(--yellow);color:var(--navy);padding:12px 20px;font-size:13px;font-weight:900;letter-spacing:.01em;min-height:42px}.btn:hover{background:#fff18a}.btn.secondary{background:#fff;border:1px solid var(--line)}.btn.navy{background:var(--navy);color:#fff}.btn.danger{background:var(--red);color:#fff}.btn.text{background:transparent;padding:10px;color:var(--navy)}.btn.block{width:100%}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:100px;padding:7px 11px;font-size:11px;font-weight:800;line-height:1.1;background:#edf4f7;color:var(--navy)}.pill.yellow{background:var(--yellow);color:var(--navy)}.pill.green{background:var(--greenbg);color:var(--green)}.pill.red{background:var(--redbg);color:var(--red)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.gray{background:#edf0f1;color:#55616a}.choice-row{display:flex;gap:10px;flex-wrap:wrap}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 17px;color:var(--navy);font-weight:800;min-width:150px;text-align:left}.choice.selected{border:2px solid var(--navy);background:#edf4f7;padding:13px 16px}.choice span{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:4px}.field{display:grid;gap:7px;min-width:0}.field label,.label{font-size:12px;font-weight:800;color:#39444b}.field input,.field select,.field textarea,.inputlike{width:100%;border:1px solid #d9dddf;border-radius:11px;padding:12px 13px;background:#fff;min-height:42px;color:#263744}.field textarea{height:82px;resize:vertical}.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.formrow.threecol{grid-template-columns:repeat(3,minmax(0,1fr))}.line-list{display:grid}.line-item{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}.line-item:last-child{border-bottom:0}.avatar{width:38px;height:38px;border-radius:50%;background:#dce9f1;color:var(--navy);display:grid;place-items:center;font-weight:800;flex:none}.avatar.yellow{background:var(--yellow)}.person{display:flex;align-items:center;gap:11px}.person .name{font-weight:800;font-size:13px}.person .meta{font-size:11px;color:var(--muted);margin-top:2px}.stat{font-size:32px;color:var(--navy);font-weight:800}.stat.white{color:#fff}.stat-label{font-size:12px;color:var(--muted);font-weight:700}.steps{display:flex;gap:8px;margin:0 0 28px}.step{padding:8px 12px;background:#fff;border-radius:100px;color:#74818a;font-size:11px;font-weight:800}.step.active{background:var(--navy);color:#fff}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:20px}.tab{border:0;background:transparent;color:#74818a;padding:0 0 11px;font-size:13px;font-weight:800}.tab.active{border-bottom:3px solid var(--navy);color:var(--navy)}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;background:#f2f4f3;color:#66737a;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:12px}.table td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}.table tr:last-child td{border:0}.table .right{text-align:right}.number{font-family:"Geist Mono",Consolas,monospace;font-weight:700}.court{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:100%;aspect-ratio:1.9;background:#c6d6dd;border:4px solid #b4c6d0;border-radius:9px;padding:6px}.court-side{background:#eff7f1;border:1px solid #8eb5a2;display:grid;place-items:center;text-align:center;color:#286349;font-size:11px;font-weight:800}.court-side:nth-child(2){background:#edf4f7;border-color:#97b3c8;color:var(--navy)}.upload{border:2px dashed #bdcbd4;border-radius:12px;padding:19px;text-align:center;color:#557082;background:#fafcfc;font-size:12px}.upload strong{display:block;color:var(--navy);margin-bottom:5px}.thumbs{display:flex;gap:9px;margin-top:11px}.thumb{height:62px;width:92px;background:linear-gradient(135deg,#d7e9e4,#829e9a);border-radius:8px;position:relative;overflow:hidden}.thumb:after{content:"Minh chứng";position:absolute;bottom:0;left:0;right:0;background:#173a4aab;color:white;font-size:9px;padding:4px}.progress{height:8px;background:#e6e9e8;border-radius:99px;overflow:hidden}.progress span{display:block;background:var(--yellow);height:100%;border-radius:99px}.credit-band{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#eaf1f5;padding:16px;border-radius:12px}.credit-number{font:800 40px "Geist Mono",Consolas,monospace;color:var(--navy);letter-spacing:-.05em}.rank-number{font:900 28px Archivo,Inter,sans-serif;color:var(--navy)}.trophy{font-size:13px;color:#9b6200;font-weight:800}.callout{border-left:4px solid var(--yellow);padding:10px 16px;background:#fffdef;color:#5b5b3d;font-size:12px;line-height:1.5}.footnote{font-size:11px;color:#6d777c;line-height:1.55}.timeline{display:flex;align-items:center;gap:0}.timeline i{height:2px;background:#cbd6da;flex:1}.timeline .dot{display:grid;place-items:center;height:28px;width:28px;border-radius:50%;background:#dce9f1;color:var(--navy);font-size:10px;font-weight:900}.timeline .dot.done{background:var(--navy);color:#fff}.no-margin{margin:0}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}.mt16{margin-top:16px}.mt24{margin-top:24px}.right{text-align:right}.center{text-align:center}.full{width:100%}.nowrap{white-space:nowrap}

<body>
<div class="review">
  <aside class="review-side" aria-label="Các màn hình mockup">
    <div class="review-logo">COURTIN<span>.</span></div>
    <div class="review-kicker">Người chơi</div>
    <button data-screen="create">01 · Tạo kèo</button>
    <button data-screen="match">02 · Chi tiết kèo</button>
    <button data-screen="result">03 · Khai báo kết quả</button>
    <button data-screen="opponent">04 · Xác nhận / khiếu nại</button>
    <button data-screen="incident">05 · Khai báo sự cố</button>
    <button data-screen="passport">06 · Điểm xếp hạng</button>
    <button data-screen="leaderboard">07 · Bảng xếp hạng</button>
    <button data-screen="credits">08 · Court Credit</button>
    <button data-screen="checkout">09 · Thanh toán bằng Credit</button>
    <div class="review-kicker">Chủ sân & Admin</div>
    <button data-screen="venue">10 · Chủ sân xem xét</button>
    <button data-screen="admincase">11 · Admin xử lý</button>
    <button data-screen="campaign">12 · Tạo chương trình thưởng</button>
    <button data-screen="pool">13 · Quản lý Credit Pool</button>
    <button data-screen="payout">14 · Duyệt & trả thưởng</button>
    <small>Bản mô phỏng desktop · dữ liệu minh họa. Chọn từng màn hình để duyệt bố cục và câu chữ.</small>
  </aside>
  <main class="review-main">
    <div class="review-bar"><span><strong>COURTIN / MOCKUP</strong><span id="screen-name" class="muted"></span></span><span><span class="pill gray">Desktop 1440</span><span class="pill amber">Dữ liệu minh họa</span></span></div>
    <div id="screens"></div>
  </main>
</div>
<script>
const nav=(current='KÈO',admin=false)=>`<header class="app-nav"><div class="brand">COURTIN<span>.</span></div><nav class="nav-links"><span class="${current==='ĐẶT SÂN'?'current':''}">ĐẶT SÂN</span><span class="${current==='KÈO'?'current':''}">KÈO</span><span class="${current==='BẢNG XẾP HẠNG'?'current':''}">BẢNG XẾP HẠNG</span><span>CỘNG ĐỒNG</span>${admin?'<span class="current">QUẢN TRỊ</span>':''}</nav><div class="nav-right"><button class="btn">${admin?'QUẢN TRỊ':'TẠO KÈO'}</button><div class="nav-avatar">${admin?'AD':'MA'}</div></div></header>`;
const head=(eyebrow,title,sub,action='')=>`<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="display h1">${title}</h1><p class="sub">${sub}</p></div>${action}</div>`;
const person=(initial,name,meta,badge='')=>`<div class="person"><div class="avatar">${initial}</div><div><div class="name">${name} ${badge}</div><div class="meta">${meta}</div></div></div>`;
const pages={
create:{title:'Tạo kèo',body:`${nav()}<div class="app-content">${head('Kèo / Tạo kèo','TẠO KÈO MỚI','Chọn thể thức trước khi mời người chơi. Chế độ sẽ được khóa khi có người tham gia.')}<div class="steps"><span class="step active">1 · CẤU HÌNH</span><span class="step">2 · MỜI NGƯỜI CHƠI</span><span class="step">3 · THANH TOÁN</span></div><div class="grid two"><div class="stack"><section class="card"><h2 class="h2">Chế độ kèo</h2><div class="choice-row"><button class="choice">Giao lưu<span>Chơi tự do, không tính điểm.</span></button><button class="choice selected">Xếp hạng<span>Điểm và thành tích được ghi nhận.</span></button></div><div class="callout mt16">Kèo xếp hạng cần email và số điện thoại đã xác minh. Kết quả phải có tỷ số và ảnh; đối thủ có 24 giờ để khiếu nại.</div></section><section class="card"><h2 class="h2">Thể thức</h2><div class="choice-row"><button class="choice">Đánh đơn<span>2 người · mỗi người trả 50%</span></button><button class="choice selected">Đánh đôi<span>4 người · mỗi người trả 25%</span></button></div><div class="formrow mt24"><div class="field"><label>Trình độ phù hợp</label><select><option>Trung bình – Bán chuyên</option></select></div><div class="field"><label>Tên kèo</label><input value="Kèo đôi tối thứ Bảy"></div></div><div class="field mt16"><label>Lời mời</label><textarea>Mình cần thêm 3 bạn đánh đôi, ưu tiên vui vẻ và đúng giờ.</textarea></div></section></div><aside class="stack"><section class="card"><div class="row"><h2 class="h2 no-margin">Slot sân đã chọn</h2><span class="pill yellow">ĐANG GIỮ CHỖ</span></div><p class="strong mb8">Sân số 03 · Nhà thi đấu Quận 7</p><p class="sub">Thứ Bảy, 26/09 · 18:00–19:00 · TP. Hồ Chí Minh</p><div class="divider"></div><div class="row"><span>Giá sân</span><strong class="number">200.000đ</strong></div><div class="row mt16"><span>Mỗi người trong kèo đôi</span><strong class="number">50.000đ</strong></div></section><section class="card yellow-card"><div class="row"><h3 class="h3 no-margin">Court Credit</h3><span class="pill gray">ĐANG ÁP DỤNG</span></div><p class="sub mt16">Thắng trận xếp hạng đầu tiên trong ngày có thể nhận Credit theo phần tiền thật đã đóng. 1 Court Credit = 1.000đ.</p><div class="divider"></div><p class="footnote">Nếu chương trình Credit tạm dừng, trạng thái sẽ được báo trước khi xác nhận kèo. Điểm xếp hạng vẫn được tính.</p></section><button class="btn block" data-go="match">TIẾP TỤC TẠO KÈO</button></aside></div></div>`},
match:{title:'Chi tiết kèo',body:`${nav()}<div class="app-content">${head('Kèo / Chi tiết','KÈO ĐÔI TỐI THỨ BẢY','Sân số 03 · Nhà thi đấu Quận 7 · 26/09, 18:00–19:00',`<span class="pill green">XẾP HẠNG · ĐÁNH ĐÔI</span>`)}<div class="grid two"><div class="stack"><section class="card"><div class="row"><h2 class="h2 no-margin">Hai đội thi đấu</h2><span class="pill gray">4 / 4 người</span></div><div class="grid two mt24" style="grid-template-columns:1fr 150px 1fr;align-items:center"><div class="stack gap8">${person('MA','Minh Anh','Điểm đôi 1.542','<span class="pill yellow">CHỦ KÈO</span>')}${person('LT','Lan Trần','Điểm đôi 1.518')}</div><div class="court"><div class="court-side">ĐỘI A</div><div class="court-side">ĐỘI B</div></div><div class="stack gap8">${person('KH','Khánh Hoàng','Điểm đôi 1.589')}${person('PN','Phúc Nguyễn','Điểm đôi 1.501')}</div></div><div class="divider"></div><div class="row"><span>Thể thức</span><strong>3 set · 21 điểm · tối đa 30</strong></div><div class="row mt16"><span>Tiền sân</span><strong class="number">200.000đ / 4 người</strong></div></section><section class="card"><h2 class="h2">Tiến độ thanh toán</h2><div class="line-list"><div class="line-item">${person('MA','Minh Anh','Đội A')}<span class="pill green">ĐÃ TRẢ 50.000đ</span></div><div class="line-item">${person('LT','Lan Trần','Đội A')}<span class="pill green">ĐÃ TRẢ 50.000đ</span></div><div class="line-item">${person('KH','Khánh Hoàng','Đội B')}<span class="pill green">ĐÃ TRẢ 50.000đ</span></div><div class="line-item">${person('PN','Phúc Nguyễn','Đội B')}<span class="pill amber">CHỜ THANH TOÁN</span></div></div></section></div><aside class="stack"><section class="card navy-card"><span class="pill yellow">KÈO XẾP HẠNG</span><h2 class="h2 mt16">Thi đấu, rồi xác nhận kết quả</h2><p class="sub">Sau trận, một người thuộc đội thắng nhập tỷ số và tải ảnh. Đội còn lại có 24 giờ để xác nhận hoặc khiếu nại.</p><div class="divider" style="background:#49718c"></div><p class="small">Điểm đơn và đôi được tính riêng. Kết quả tranh chấp sẽ tạm chờ Admin xử lý.</p><button class="btn block mt16" data-go="result">XEM MẪU KHAI BÁO</button></section><section class="card"><h3 class="h3">Có sự cố?</h3><p class="sub">Trước, trong hoặc sau trận, người chơi có thể tự khai báo và gửi ảnh minh chứng.</p><button class="btn secondary mt16" data-go="incident">KHAI BÁO SỰ CỐ</button></section></aside></div></div>`},
result:{title:'Khai báo kết quả',body:`${nav()}<div class="app-content">${head('Kèo / Kết quả','KHAI BÁO KẾT QUẢ','Một người thuộc bên thắng có thể khai báo cho cả đội.',`<span class="pill amber mono">CÒN 08:24 / 12 GIỜ</span>`)}<div class="grid two"><div class="stack"><section class="card"><div class="row"><h2 class="h2 no-margin">Kèo đôi tối thứ Bảy</h2><span class="pill green">BOOKING ĐÃ HOÀN TẤT</span></div><p class="sub mt16">Đội A: Minh Anh, Lan Trần · Đội B: Khánh Hoàng, Phúc Nguyễn</p><div class="divider"></div><div class="row"><span class="strong">Tỷ số từng set</span><span class="small muted">Đội thắng được suy ra từ tỷ số</span></div><table class="table mt16"><thead><tr><th>Set</th><th>Đội A</th><th>Đội B</th><th>Trạng thái</th></tr></thead><tbody><tr><td>1</td><td><input class="inputlike mono" value="21" style="width:70px"></td><td><input class="inputlike mono" value="16" style="width:70px"></td><td><span class="pill green">A thắng</span></td></tr><tr><td>2</td><td><input class="inputlike mono" value="18" style="width:70px"></td><td><input class="inputlike mono" value="21" style="width:70px"></td><td><span class="pill gray">B thắng</span></td></tr><tr><td>3</td><td><input class="inputlike mono" value="21" style="width:70px"></td><td><input class="inputlike mono" value="19" style="width:70px"></td><td><span class="pill green">A thắng</span></td></tr></tbody></table><div class="success-card mt16"><strong>Kết quả suy ra: Đội A thắng 2–1.</strong> Tỷ số set không làm thay đổi số điểm cộng/trừ; hệ thống xét thắng/thua và trình độ đối thủ.</div></section><section class="card"><h2 class="h2">Ảnh minh chứng</h2><div class="upload"><strong>Kéo ảnh vào đây hoặc chọn từ máy</strong>1–3 ảnh JPG, PNG, WebP · tối đa 5 MB/ảnh</div><div class="thumbs"><div class="thumb"></div><div class="thumb"></div></div><p class="footnote">Ảnh được lưu riêng tư và chỉ người trong trận, Chủ sân phụ trách và Admin có quyền xem.</p></section></div><aside class="stack"><section class="card yellow-card"><h3 class="h3">Điều gì xảy ra sau khi gửi?</h3><div class="line-list"><div class="line-item"><span>1 · Thông báo cho đội B</span><strong>Ngay lập tức</strong></div><div class="line-item"><span>2 · Chờ xác nhận/khiếu nại</span><strong>24 giờ</strong></div><div class="line-item"><span>3 · Chốt kết quả</span><strong>Tự động</strong></div></div><p class="footnote mt16">Nếu cả hai người đội B đồng ý, kết quả được chốt sớm. Nếu có khiếu nại, rating và phần thưởng tạm dừng.</p></section><button class="btn block" data-go="opponent">GỬI KẾT QUẢ (MẪU)</button><button class="btn secondary block" data-go="incident">TRẬN CÓ SỰ CỐ</button></aside></div></div>`},
opponent:{title:'Xác nhận / khiếu nại',body:`${nav()}<div class="app-content">${head('Kèo / Đối chiếu kết quả','XEM KẾT QUẢ ĐƯỢC KHAI BÁO','Đội A đã khai thắng 2–1. Bạn có thể đồng ý hoặc gửi khiếu nại.',`<span class="pill amber mono">CÒN 18:36 / 24 GIỜ</span>`)}<div class="grid two"><div class="stack"><section class="card"><div class="row"><h2 class="h2 no-margin">Đội A 2 – 1 Đội B</h2><span class="pill amber">CHỜ ĐỐI THỦ XÁC NHẬN</span></div><p class="sub mt16">Người khai báo: Minh Anh · Gửi lúc 19:28, 26/09</p><table class="table mt16"><thead><tr><th>Set 1</th><th>Set 2</th><th>Set 3</th></tr></thead><tbody><tr><td>21–16</td><td>18–21</td><td>21–19</td></tr></tbody></table><div class="divider"></div><strong class="small">Bằng chứng đã gửi</strong><div class="thumbs"><div class="thumb"></div><div class="thumb"></div></div></section><section class="card"><h2 class="h2">Phản hồi của bạn</h2><p class="sub mb16">Nếu không phản hồi trong 24 giờ, kết quả sẽ tự được ghi nhận. Khiếu nại cần nêu lý do và tải 1–3 ảnh.</p><div class="choice-row"><button class="btn navy">TÔI ĐỒNG Ý VỚI KẾT QUẢ</button><button class="btn secondary" data-go="incident">KHIẾU NẠI KẾT QUẢ</button></div></section></div><aside class="stack"><section class="card navy-card"><h3 class="h3">Quy trình minh bạch</h3><p class="sub">Mọi khiếu nại làm tạm dừng cập nhật điểm và thưởng. Chủ sân xem xét, sau đó Admin quyết định cuối cùng.</p><button class="btn mt24" data-go="incident">XEM MẪU KHIẾU NẠI</button></section><section class="card"><h3 class="h3">Lưu ý</h3><p class="sub">Bạn chỉ cần phản hồi phần kết quả của trận này. Đánh giá thái độ sau trận là luồng riêng.</p></section></aside></div></div>`},
incident:{title:'Khai báo sự cố',body:`${nav()}<div class="app-content">${head('Kèo / Sự cố','KHAI BÁO SỰ CỐ TRẬN ĐẤU','Báo vấn đề xảy ra trước, trong hoặc sau trận để Chủ sân xem xét và gửi đề xuất cho Admin.')}<div class="grid two"><div class="stack"><section class="card"><div class="formrow"><div class="field"><label>Vấn đề xảy ra khi nào?</label><select><option>Trong trận</option><option>Trước trận</option><option>Sau trận</option></select></div><div class="field"><label>Loại vấn đề</label><select><option>Một bên không đến / đến muộn</option><option>Trận bị gián đoạn</option><option>Khai báo tỷ số không đúng</option><option>Vấn đề về sân</option></select></div></div><div class="field mt16"><label>Mô tả sự việc</label><textarea>Một người đội B không đến sân. Các thành viên còn lại đã đợi và có ảnh tại sân.</textarea></div><div class="field mt16"><label>Bạn đề nghị kết luận nào?</label><select><option>Hủy kết quả xếp hạng</option><option>Đội A thắng</option><option>Đội B thắng</option></select></div></section><section class="card"><h2 class="h2">Ảnh minh chứng bắt buộc</h2><div class="upload"><strong>Chọn từ 1 đến 3 ảnh</strong>JPG, PNG hoặc WebP · tối đa 5 MB mỗi ảnh</div><div class="thumbs"><div class="thumb"></div></div></section></div><aside class="stack"><section class="card yellow-card"><h3 class="h3">Sau khi gửi</h3><p class="sub">Điểm xếp hạng và Court Credit của trận được tạm dừng. Chủ sân có 24 giờ xem xét; nếu Chủ sân liên quan đến sự cố hoặc quá hạn, hồ sơ chuyển thẳng Admin.</p></section><button class="btn block" data-go="venue">GỬI KHAI BÁO (MẪU)</button></aside></div></div>`},
passport:{title:'Điểm xếp hạng',body:`${nav('BẢNG XẾP HẠNG')}<div class="app-content">${head('Hồ sơ / Điểm xếp hạng','ĐIỂM XẾP HẠNG CỦA TÔI','Điểm phản ánh thành tích gần đây và trình độ đối thủ; tăng khi thắng, giảm khi thua.')}<div class="grid three"><section class="card navy-card"><span class="pill yellow">ĐÁNH ĐƠN</span><div class="stat white mono mt16">1.582</div><p class="small">Trung bình · +18 sau trận gần nhất</p><div class="divider" style="background:#49718c"></div><p class="small">RD 84 · Mức độ chắc chắn cao</p></section><section class="card"><span class="pill gray">ĐÁNH ĐÔI</span><div class="stat mono mt16">1.618</div><p class="small muted">Trung bình khá · +12 sau trận gần nhất</p><div class="divider"></div><p class="small muted">RD 112 · Đang ổn định</p></section><section class="card yellow-card"><h3 class="h3">RD là gì?</h3><p class="sub">RD đo mức độ chắc chắn của điểm, không phải điểm thưởng. Chơi thêm các trận xếp hạng hợp lệ giúp hệ thống hiểu trình độ của bạn rõ hơn.</p><p class="footnote mt16">Để được xếp hạng: tối thiểu 5 trận đã chốt và RD dưới 200.</p></section></div><div class="grid two mt24"><section class="card"><div class="row"><h2 class="h2 no-margin">Lịch sử điểm</h2><span class="pill gray">ĐÁNH ĐÔI</span></div><table class="table mt16"><thead><tr><th>Trận</th><th>Kết quả</th><th>Đối thủ</th><th class="right">Thay đổi</th></tr></thead><tbody><tr><td>26/09 · Sân Q7</td><td><span class="pill green">THẮNG</span></td><td>Đội Khánh & Phúc</td><td class="right number" style="color:var(--green)">+12</td></tr><tr><td>22/09 · Sân Bến Thành</td><td><span class="pill red">THUA</span></td><td>Đội Huy & Nam</td><td class="right number" style="color:var(--red)">−9</td></tr><tr><td>19/09 · Sân Q7</td><td><span class="pill green">THẮNG</span></td><td>Đội Vy & Trúc</td><td class="right number" style="color:var(--green)">+16</td></tr></tbody></table></section><aside class="stack"><section class="card"><h3 class="h3">Thành tích của bạn</h3><div class="choice-row"><span class="pill yellow">CHUỖI THẮNG 5 TRẬN</span><span class="pill green">TOP 10 TP. HỒ CHÍ MINH</span></div><p class="sub mt16">Điểm đôi 1.618 đã đưa bạn lên bảng Trung bình khá – Bán chuyên ngay trong kỳ.</p><button class="btn secondary mt16" data-go="leaderboard">XEM BẢNG XẾP HẠNG</button></section><section class="card"><h3 class="h3">Court Credit</h3><div class="row"><span class="stat mono">35</span><span class="small muted">= 35.000đ giảm khi đặt sân</span></div><button class="btn text" data-go="credits">XEM SỐ DƯ & LỊCH SỬ →</button></section></aside></div></div>`},
leaderboard:{title:'Bảng xếp hạng',body:`${nav('BẢNG XẾP HẠNG')}<div class="app-content">${head('Cộng đồng / Xếp hạng','BẢNG XẾP HẠNG','Vị trí cập nhật theo kết quả xếp hạng đã được chốt.',`<button class="btn" data-go="credits">COURT CREDIT CỦA TÔI</button>`)}<div class="card mb24"><div class="formrow threecol"><div class="field"><label>Thể thức</label><select><option>Đánh đôi</option><option>Đánh đơn</option></select></div><div class="field"><label>Trình độ</label><select><option>Trung bình khá – Bán chuyên (≥ 1600)</option><option>Mới chơi – Trung bình (&lt; 1600)</option></select></div><div class="field"><label>Phạm vi</label><select><option>TP. Hồ Chí Minh</option><option>Toàn nền tảng</option></select></div></div></div><div class="grid two"><div class="stack"><section class="card"><div class="row"><div><h2 class="h2 mb8">Bảng đôi · TP. Hồ Chí Minh</h2><p class="sub">Kỳ 01/09–30/09 · Yêu cầu 5 trận tại TP. Hồ Chí Minh trong kỳ</p></div><span class="pill green">ĐANG DIỄN RA</span></div><table class="table mt24"><thead><tr><th>Hạng</th><th>Người chơi</th><th>Điểm</th><th>RD</th><th>Trận tại khu vực</th><th class="right">Giải dự kiến</th></tr></thead><tbody><tr><td class="rank-number">01</td><td>${person('TH','Thu Hà','Trung bình khá')}</td><td class="number">1.746</td><td class="mono">68</td><td>12</td><td class="right number">2.000.000đ</td></tr><tr><td class="rank-number">02</td><td>${person('QN','Quang Nam','Trung bình khá')}</td><td class="number">1.702</td><td class="mono">91</td><td>9</td><td class="right number">1.000.000đ</td></tr><tr><td class="rank-number">03</td><td>${person('MA','Minh Anh','Trung bình khá')}</td><td class="number">1.618</td><td class="mono">112</td><td>6</td><td class="right number">500.000đ</td></tr><tr><td class="rank-number">04</td><td>${person('HK','Hà Khang','Trung bình khá')}</td><td class="number">1.611</td><td class="mono">119</td><td>7</td><td class="right muted">—</td></tr></tbody></table></section><div class="callout">Nếu bằng điểm cuối kỳ, tiền thưởng của các vị trí bị chiếm sẽ được cộng lại và chia đều. Admin duyệt kết quả cuối trước khi trả thưởng.</div></div><aside class="stack"><section class="card navy-card"><span class="pill yellow">CHƯƠNG TRÌNH ĐANG CHẠY</span><h2 class="h2 mt16">Top điểm đôi TP. Hồ Chí Minh</h2><p class="sub">Bảng Trung bình khá – Bán chuyên</p><div class="stat white mono mt24">04 NGÀY 12:36</div><p class="small">còn lại đến khi kết thúc kỳ</p><div class="divider" style="background:#49718c"></div><div class="row"><span>Top 1</span><strong class="number">2.000.000đ</strong></div><div class="row mt16"><span>Top 2</span><strong class="number">1.000.000đ</strong></div><div class="row mt16"><span>Top 3</span><strong class="number">500.000đ</strong></div></section><section class="card"><h3 class="h3">Điều kiện hiển thị</h3><p class="sub">Cần tối thiểu 5 trận xếp hạng đã chốt và RD dưới 200. Vị trí ở tỉnh/thành còn yêu cầu 5 trận tại khu vực trong kỳ.</p></section></aside></div></div>`},
credits:{title:'Court Credit',body:`${nav()}<div class="app-content">${head('Hồ sơ / Court Credit','COURT CREDIT','Số dư khuyến mãi dùng để giảm tiền đặt sân.',`<button class="btn" data-go="checkout">DÙNG CREDIT ĐẶT SÂN</button>`)}<div class="grid three"><section class="card navy-card"><p class="small no-margin">Credit có thể sử dụng</p><div class="stat white mono mt16">35</div><p class="small">= 35.000đ giảm khi đặt sân</p><div class="divider" style="background:#49718c"></div><p class="small">Sắp hết hạn: 10 Credit vào 24/12</p></section><section class="card yellow-card"><p class="small no-margin">Đã đạt · chờ ngân sách</p><div class="stat mono mt16">12</div><p class="small">Chưa nằm trong số dư dùng được</p><div class="divider"></div><p class="footnote">Được cấp theo thứ tự phát sinh khi Credit Pool có tiền. Hạn 90 ngày bắt đầu từ lúc Credit được cấp.</p></section><section class="card"><h3 class="h3">Cách dùng</h3><p class="sub">1 Court Credit = 1.000đ giảm trực tiếp khi đặt sân. Không thể rút hoặc chuyển. Mỗi booking dùng tối đa 50%.</p><p class="footnote mt16">Chủ sân nhận tiền bình thường; phần Credit do nền tảng bảo chứng.</p></section></div><div class="grid two mt24"><section class="card"><div class="row"><h2 class="h2 no-margin">Lịch sử Credit</h2><span class="pill gray">THÁNG 9</span></div><table class="table mt16"><thead><tr><th>Hoạt động</th><th>Ngày</th><th>Trạng thái</th><th class="right">Credit</th></tr></thead><tbody><tr><td>Thắng ranked đầu ngày · kèo đôi</td><td>26/09</td><td><span class="pill amber">CHỜ NGÂN SÁCH</span></td><td class="right number">+12</td></tr><tr><td>Chuỗi thắng 5 trận · đôi</td><td>24/09</td><td><span class="pill green">ĐÃ CẤP</span></td><td class="right number">+5</td></tr><tr><td>Thắng ranked đầu ngày · đơn</td><td>22/09</td><td><span class="pill green">ĐÃ CẤP</span></td><td class="right number">+20</td></tr><tr><td>Dùng để đặt sân</td><td>20/09</td><td><span class="pill gray">ĐÃ SỬ DỤNG</span></td><td class="right number">−10</td></tr></tbody></table></section><aside class="card"><h3 class="h3">Tiến độ thưởng tháng này</h3><p class="sub mb12">Thắng đầu ngày: <strong>86 / 200 Credit</strong></p><div class="progress"><span style="width:43%"></span></div><p class="footnote mt16">Thưởng thắng đầu ngày bằng 10% phần tiền thật bạn đã đóng, làm tròn xuống theo 1.000đ, tối đa 30 Credit/trận. Thưởng chuỗi 5, 10, 15… là khoản riêng.</p></aside></div></div>`},
checkout:{title:'Thanh toán bằng Credit',body:`${nav('ĐẶT SÂN')}<div class="app-content">${head('Đặt sân / Thanh toán','XÁC NHẬN THANH TOÁN','Sân số 03 · Nhà thi đấu Quận 7 · 26/09, 18:00–19:00')}<div class="steps"><span class="step">1 · CHỌN SLOT</span><span class="step">2 · XÁC NHẬN</span><span class="step active">3 · THANH TOÁN</span></div><div class="grid two"><section class="card"><h2 class="h2">Nguồn thanh toán</h2><div class="credit-band"><div><strong>Dùng Court Credit</strong><p class="sub">Bạn có 35 Credit khả dụng = 35.000đ</p></div><span class="pill green">ĐANG BẬT</span></div><div class="field mt24"><label>Số Credit muốn dùng</label><input id="credit-input" class="mono" type="number" min="0" max="35" value="35"></div><p class="footnote">Booking 200.000đ · tối đa dùng 100 Credit (50%). Số dư của bạn hiện cho phép dùng tối đa 35 Credit.</p><div class="divider"></div><h3 class="h3">Phần tiền còn lại</h3><div class="choice-row"><button class="choice selected">Ví cá nhân<span>Thanh toán phần tiền thật</span></button><button class="choice">Chuyển khoản<span>Qua cổng thanh toán</span></button></div><div class="success-card mt24">1 Court Credit = 1.000đ. Credit không thể rút hoặc chuyển. Chủ sân nhận đủ phần tiền theo settlement bình thường.</div></section><aside class="stack"><section class="card"><h2 class="h2">Tóm tắt thanh toán</h2><div class="line-list"><div class="line-item"><span>Giá trị booking</span><strong class="number">200.000đ</strong></div><div class="line-item"><span>Court Credit sử dụng</span><strong id="credit-offset" class="number">−35.000đ</strong></div><div class="line-item"><strong>Bạn thanh toán tiền thật</strong><strong id="cash-total" class="number">165.000đ</strong></div></div><p class="footnote mt16">Phần Credit được bảo chứng từ Credit Pool của nền tảng.</p></section><button class="btn block">XÁC NHẬN THANH TOÁN (MẪU)</button></aside></div></div>`},
venue:{title:'Chủ sân xem xét',body:`${nav('QUẢN TRỊ',true)}<div class="app-content">${head('Quản lý sân / Sự cố trận đấu','XEM XÉT SỰ CỐ','Kèo đôi tối thứ Bảy · Sân số 03 · 26/09, 18:00–19:00',`<span class="pill amber mono">CÒN 15:42 / 24 GIỜ</span>`)}<div class="grid two"><div class="stack"><section class="card"><div class="row"><h2 class="h2 no-margin">Khai báo từ Minh Anh</h2><span class="pill red">KẾT QUẢ ĐANG TẠM DỪNG</span></div><p class="sub mt16">Trong trận · Một bên không đến / đến muộn</p><div class="soft mt16">“Một người đội B không đến sân. Các thành viên còn lại đã đợi và có ảnh tại sân.”</div><p class="small strong mt16">Bằng chứng: 1 ảnh</p><div class="thumbs"><div class="thumb"></div></div></section><section class="card"><h2 class="h2">Gửi kết luận đề xuất</h2><div class="field"><label>Kết luận đề xuất</label><select><option>Hủy kết quả xếp hạng</option><option>Đội A thắng</option><option>Đội B thắng</option></select></div><div class="field mt16"><label>Lý do và thông tin từ sân</label><textarea>Camera sân cho thấy người chơi báo vắng không có mặt trong khung giờ đã đặt.</textarea></div><button class="btn mt16" data-go="admincase">GỬI ĐỀ XUẤT CHO ADMIN</button></section></div><aside class="stack"><section class="card yellow-card"><h3 class="h3">Vai trò Chủ sân</h3><p class="sub">Bạn xem xét sự việc tại sân và gửi đề xuất. Admin là người quyết định kết quả xếp hạng cuối cùng.</p></section><section class="card"><h3 class="h3">Xung đột lợi ích?</h3><p class="sub">Nếu bạn tham gia trận, có liên quan đến một bên hoặc sự cố xuất phát từ sân, hồ sơ cần chuyển thẳng cho Admin.</p><button class="btn secondary mt16" data-go="admincase">CHUYỂN THẲNG ADMIN</button></section></aside></div></div>`},
admincase:{title:'Admin xử lý',body:`${nav('QUẢN TRỊ',true)}<div class="app-content">${head('Quản trị / Khiếu nại kèo','QUYẾT ĐỊNH KẾT QUẢ CUỐI','Kèo đôi tối thứ Bảy · Hồ sơ đã có đề xuất từ Chủ sân.',`<span class="pill red">ĐANG TẠM DỪNG ĐIỂM & THƯỞNG</span>`)}<div class="grid two"><div class="stack"><section class="card"><h2 class="h2">Tổng hợp hồ sơ</h2><div class="line-list"><div class="line-item"><span>Kết quả đã khai báo</span><strong>Đội A thắng 2–1</strong></div><div class="line-item"><span>Người khiếu nại</span><strong>Phúc Nguyễn · Đội B</strong></div><div class="line-item"><span>Vấn đề</span><strong>Một bên không đến</strong></div><div class="line-item"><span>Đề xuất của Chủ sân</span><span class="pill amber">HỦY KẾT QUẢ RANKED</span></div></div><div class="divider"></div><div class="thumbs"><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div></div><p class="footnote">Ảnh từ hai bên và Chủ sân. Xem đầy đủ trước khi ra quyết định.</p></section><section class="card"><h2 class="h2">Quyết định của Admin</h2><div class="choice-row"><button class="choice">Đội A thắng<span>Cập nhật điểm và thưởng</span></button><button class="choice">Đội B thắng<span>Cập nhật điểm và thưởng</span></button><button class="choice selected">Hủy ranked<span>Không cập nhật điểm/thưởng</span></button></div><div class="field mt16"><label>Lý do quyết định</label><textarea>Không đủ điều kiện xác nhận trận đã diễn ra đúng thể thức.</textarea></div><button class="btn danger mt16">XÁC NHẬN QUYẾT ĐỊNH (MẪU)</button></section></div><aside class="stack"><section class="card navy-card"><h3 class="h3">Sau khi quyết định</h3><p class="sub">Hệ thống gửi thông báo trong ứng dụng và email cho toàn bộ người chơi. Rating và Court Credit chỉ được xử lý nếu Admin công nhận bên thắng.</p></section><section class="card"><h3 class="h3">Dòng thời gian</h3><div class="line-list"><div class="line-item"><span>Người chơi báo sự cố</span><span class="mono small">26/09 20:05</span></div><div class="line-item"><span>Chủ sân gửi đề xuất</span><span class="mono small">27/09 09:18</span></div><div class="line-item"><span>Admin ra quyết định</span><span class="pill amber">ĐANG CHỜ</span></div></div></section></aside></div></div>`},
campaign:{title:'Tạo chương trình thưởng',body:`${nav('QUẢN TRỊ',true)}<div class="app-content">${head('Quản trị / Treo thưởng','TẠO CHƯƠNG TRÌNH THƯỞNG','Admin chọn hạng mục cụ thể rồi mới cấu hình tiền thưởng và thời gian.')}<div class="grid two"><div class="stack"><section class="card"><h2 class="h2">1 · Chọn hạng mục</h2><div class="field"><label>Tiêu chí chương trình</label><select><option>Chọn một tiêu chí…</option><option selected>Top điểm xếp hạng</option><option>Tăng điểm nhiều nhất</option><option>Chuỗi thắng</option></select></div><p class="footnote">Chỉ hạng mục được chọn xuất hiện trong chương trình; không có hạng mục mặc định được đăng tự động.</p><div class="formrow threecol mt16"><div class="field"><label>Phạm vi</label><select><option>TP. Hồ Chí Minh</option><option>Toàn nền tảng</option></select></div><div class="field"><label>Thể thức</label><select><option>Đánh đôi</option><option>Đánh đơn</option></select></div><div class="field"><label>Dải trình độ</label><select><option>Trung bình khá – Bán chuyên</option><option>Mới chơi – Trung bình</option></select></div></div></section><section class="card"><h2 class="h2">2 · Thời gian & hạng thưởng</h2><div class="formrow"><div class="field"><label>Bắt đầu</label><input value="01/10/2026 00:00"></div><div class="field"><label>Kết thúc</label><input value="31/10/2026 23:59"></div></div><table class="table mt16"><thead><tr><th>Vị trí</th><th>Tiền thưởng</th><th></th></tr></thead><tbody><tr><td>Top 1</td><td><input class="inputlike mono" value="2.000.000đ"></td><td>—</td></tr><tr><td>Top 2</td><td><input class="inputlike mono" value="1.000.000đ"></td><td>—</td></tr><tr><td>Top 3</td><td><input class="inputlike mono" value="500.000đ"></td><td>—</td></tr></tbody></table><button class="btn secondary mt16">+ THÊM HẠNG THƯỞNG</button></section></div><aside class="stack"><section class="card navy-card"><h3 class="h3">Xem trước công khai</h3><span class="pill yellow">TOP ĐIỂM ĐÔI · TP. HỒ CHÍ MINH</span><div class="stat white mono mt24">3.500.000đ</div><p class="small">Tổng thưởng 3 vị trí</p><div class="divider" style="background:#49718c"></div><p class="sub">Tiền thưởng và đồng hồ đếm ngược sẽ hiển thị trên bảng xếp hạng khi chương trình được công bố.</p></section><section class="card yellow-card"><h3 class="h3">Sau khi công bố</h3><p class="sub">Không thể giảm tiền thưởng, đổi tiêu chí hoặc rút ngắn thời gian. Nếu buộc hủy khi đang chạy, phải ghi lý do và thông báo người tham gia.</p></section><button class="btn block">LƯU BẢN NHÁP</button><button class="btn secondary block">CÔNG BỐ CHƯƠNG TRÌNH</button></aside></div></div>`},
pool:{title:'Quản lý Credit Pool',body:`${nav('QUẢN TRỊ',true)}<div class="app-content">${head('Quản trị / Court Credit','CREDIT POOL','Nguồn chính: phần Platform Fee đã hoàn tất và được nền tảng thực thu.',`<span class="pill red">TẠM DỪNG THƯỞNG MỚI</span>`)}<div class="grid three"><section class="card"><span class="stat-label">Số dư khả dụng</span><div class="stat mono mt16">4.000đ</div><p class="footnote">Tiền chưa reserve, chưa đủ cho reward tiếp theo.</p></section><section class="card"><span class="stat-label">Đã bảo chứng Credit</span><div class="stat mono mt16">1.250.000đ</div><p class="footnote">Tương ứng 1.250 Credit đã cấp, chưa dùng.</p></section><section class="card yellow-card"><span class="stat-label">Reward chờ ngân sách</span><div class="stat mono mt16">310.000đ</div><p class="footnote">Ghi theo thứ tự phát sinh; chưa vào ví người chơi.</p></section></div><div class="grid two mt24"><div class="stack"><section class="card"><div class="row"><h2 class="h2 no-margin">Cơ chế tự tạm dừng</h2><span class="pill red">ĐANG TẠM DỪNG</span></div><div class="formrow mt24"><div class="field"><label>Số dư an toàn tối thiểu</label><input class="mono" value="5.000.000đ"></div><div class="field"><label>Trần reward chờ ngân sách</label><input class="mono" value="500.000đ"></div></div><div class="danger-card mt16"><strong>Pool thấp hơn ngưỡng an toàn 4.996.000đ.</strong> Reward mới không phát sinh từ thời điểm tạm dừng. Các reward đủ điều kiện trước đó vẫn được ghi chờ ngân sách.</div><p class="footnote mt16">Tự mở lại khi backlog = 0 và số dư khả dụng ≥ 5.000.000đ. Ngưỡng do Admin cấu hình, không có mặc định chung.</p></section><section class="card"><h2 class="h2">Reward chờ cấp · theo thứ tự</h2><table class="table"><thead><tr><th>Thời điểm đạt</th><th>Người chơi</th><th>Nguồn</th><th class="right">Số tiền cần</th></tr></thead><tbody><tr><td class="mono">25/09 18:12</td><td>Minh Anh</td><td>Thắng đầu ngày</td><td class="right number">12.000đ</td></tr><tr><td class="mono">25/09 18:27</td><td>Quang Nam</td><td>Chuỗi 10</td><td class="right number">10.000đ</td></tr><tr><td class="mono">25/09 19:04</td><td>Thu Hà</td><td>Thắng đầu ngày</td><td class="right number">18.000đ</td></tr></tbody></table></section></div><aside class="stack"><section class="card navy-card"><h3 class="h3">Nguồn vào Pool</h3><div class="row mt24"><span>Platform Fee settled</span><strong class="number">+125.000đ</strong></div><p class="small">Đã phát sinh và được phân bổ trước đó</p><div class="row mt16"><span>Marketing / tài trợ</span><strong class="number">+500.000đ</strong></div><div class="divider" style="background:#49718c"></div><div class="field"><label style="color:#fff">Tỷ lệ trích Platform Fee</label><select><option>25% từ khoản settled tiếp theo</option></select></div><button class="btn block mt16">ĐIỀU CHỈNH TỶ LỆ</button><button class="btn secondary block mt16">BỔ SUNG NGÂN SÁCH</button></section><section class="card"><h3 class="h3">Dòng tiền mẫu</h3><p class="sub">Booking 200.000đ → Platform Fee 20.000đ → trích 5.000đ vào Pool → giữ lại 15.000đ.</p><p class="footnote mt16">Chỉ trích khi Platform Fee đã final/settled. Credit được reserve 1:1 lúc cấp; khi dùng, Pool bù cho booking thay người chơi.</p></section></aside></div></div>`},
payout:{title:'Duyệt & trả thưởng',body:`${nav('QUẢN TRỊ',true)}<div class="app-content">${head('Quản trị / Treo thưởng','DUYỆT & TRẢ THƯỞNG','Chương trình Top điểm đôi TP. Hồ Chí Minh · kỳ 01/09–30/09.',`<span class="pill amber">CHỜ ADMIN DUYỆT</span>`)}<div class="grid two"><div class="stack"><section class="card"><div class="row"><h2 class="h2 no-margin">Hệ thống đã tính kết quả</h2><span class="pill green">ĐÃ CHỐT SAU 72 GIỜ</span></div><table class="table mt24"><thead><tr><th>Hạng</th><th>Người nhận</th><th>Điểm cuối</th><th>Thưởng</th><th>Thông tin</th></tr></thead><tbody><tr><td class="number">01</td><td>Thu Hà</td><td class="number">1.746</td><td class="number">2.000.000đ</td><td><span class="pill green">ĐẦY ĐỦ</span></td></tr><tr><td class="number">02</td><td>Quang Nam</td><td class="number">1.702</td><td class="number">1.000.000đ</td><td><span class="pill amber">THIẾU NGÂN HÀNG</span></td></tr><tr><td class="number">03</td><td>Minh Anh</td><td class="number">1.618</td><td class="number">500.000đ</td><td><span class="pill green">ĐẦY ĐỦ</span></td></tr></tbody></table><div class="callout mt16">Nếu người đạt giải không bổ sung ngân hàng trong 7 ngày, phần thưởng của người đó bị hủy; vị trí tiếp theo không được đôn lên.</div></section><section class="card"><h2 class="h2">Thanh toán thủ công</h2><div class="formrow"><div class="field"><label>Người nhận</label><input value="Thu Hà · Top 1"></div><div class="field"><label>Giá trị</label><input class="mono" value="2.000.000đ"></div></div><div class="formrow mt16"><div class="field"><label>Ngân hàng / tài khoản</label><input value="VCB · 0123 456 789"></div><div class="field"><label>Chủ tài khoản</label><input value="NGUYEN THI THU HA"></div></div><div class="formrow mt16"><div class="field"><label>Mã tham chiếu chuyển khoản</label><input placeholder="Nhập sau khi chuyển tiền"></div><div class="field"><label>Bằng chứng chuyển tiền</label><div class="inputlike">Chọn tệp minh chứng</div></div></div></section></div><aside class="stack"><section class="card navy-card"><h3 class="h3">Quy trình duyệt</h3><div class="timeline mt24"><span class="dot done">1</span><i></i><span class="dot done">2</span><i></i><span class="dot">3</span></div><p class="small">Hệ thống tính → Admin duyệt → Admin chuyển tiền</p><div class="divider" style="background:#49718c"></div><p class="sub">Người nhận cần email, số điện thoại, họ tên, địa chỉ và thông tin ngân hàng. Hệ thống thông báo qua ứng dụng và email.</p><button class="btn block mt16">DUYỆT KẾT QUẢ CUỐI</button></section><section class="card"><h3 class="h3">Sau khi chuyển khoản</h3><p class="sub">Ghi mã tham chiếu và bằng chứng chuyển tiền trước khi đánh dấu đã trả; người nhận được thông báo ngay.</p><button class="btn secondary block mt16">XÁC NHẬN ĐÃ TRẢ (MẪU)</button></section></aside></div></div>`}
};
const container=document.getElementById('screens');for(const [key,page] of Object.entries(pages)){const section=document.createElement('section');section.className='screen';section.id=key;section.innerHTML=page.body;container.appendChild(section)}
function activate(key){if(!pages[key])key='create';document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('active',el.id===key));document.querySelectorAll('[data-screen]').forEach(el=>{const active=el.dataset.screen===key;el.classList.toggle('active',active);el.setAttribute('aria-current',active?'page':'false')});document.getElementById('screen-name').textContent=' / '+pages[key].title;history.replaceState(null,'','#'+key);window.scrollTo(0,0)}
document.addEventListener('click',event=>{const screenButton=event.target.closest('[data-screen]');if(screenButton)activate(screenButton.dataset.screen);const go=event.target.closest('[data-go]');if(go)activate(go.dataset.go)});
document.addEventListener('input',event=>{if(event.target.id==='credit-input'){const amount=Math.min(35,Math.max(0,Number(event.target.value)||0));document.getElementById('credit-offset').textContent='−'+(amount*1000).toLocaleString('vi-VN')+'đ';document.getElementById('cash-total').textContent=(200000-amount*1000).toLocaleString('vi-VN')+'đ'}});
window.addEventListener('hashchange',()=>activate(location.hash.slice(1)));activate(location.hash.slice(1)||'create');
</script>
</body>
